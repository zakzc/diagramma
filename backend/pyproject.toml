[project]
name = "diagramma"
version = "0.2.0"
description = "Local web app that turns a GitHub repo into a C4 component diagram (Mermaid)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sse-starlette>=2.1",
  "pyyaml>=6.0.3",
  "tree-sitter>=0.26.1",
  "tree-sitter-language-pack>=1.25.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
